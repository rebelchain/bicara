<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bicara App - Enter Amount</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,500&amp;f[]=satoshi@700,500,400&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Satoshi', 'sans-serif'],
                        display: ['Cabinet Grotesk', 'sans-serif'],
                    },
                    colors: {
                        'bicara-bg': '#0f0f0f',
                        'bicara-card': '#1a1a1a',
                        'bicara-neon': '#ccff00',
                        'bicara-neon-hover': '#b3e600',
                        'bicara-purple': '#a855f7',
                        'bicara-blue': '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Remove number input spin buttons */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-bicara-bg text-[#f4f4f5] font-sans antialiased selection:bg-bicara-neon selection:text-bicara-bg overflow-hidden">
    
    <div class="w-full h-screen flex flex-col relative" data-sd-id="1">
        
        <!-- Header -->
        <header class="shrink-0 pt-14 px-6 pb-4 flex items-center gap-4 z-10" data-sd-id="2">
            <a href="https://draft-6f40c2c5-a9c0-4ca6-835f-85c5a7ecb96f.preview.superdesign.dev" id="nav-back-link" class="w-11 h-11 rounded-full bg-bicara-card border border-white/5 flex items-center justify-center text-white hover:bg-white/5 transition-colors" data-sd-id="3">
                <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
            </a>
            <h1 class="text-xl font-bold font-display tracking-tight" data-sd-id="4">Enter Amount</h1>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-1 overflow-y-auto px-6 pb-8 space-y-6 relative" data-sd-id="5">
            
            <!-- Decorative Blur -->
            <div class="absolute top-20 left-10 w-48 h-48 bg-bicara-purple/10 rounded-full blur-3xl pointer-events-none -z-10" data-sd-id="6"></div>

            <!-- Recipient Info -->
            <section class="flex flex-col items-center justify-center py-4" data-sd-id="7">
                <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-bicara-purple to-bicara-blue mb-3 shadow-[0_0_15px_rgba(168,85,247,0.3)]" data-sd-id="8">
                    <img src="https://i.pravatar.cc/150?u=ahmad" alt="Ahmad" class="w-full h-full rounded-full border-2 border-bicara-bg object-cover" data-sd-id="9">
                </div>
                <h2 class="text-lg font-bold font-display tracking-tight" data-sd-id="10">Prabowo</h2>
                <p class="text-xs text-[#a1a1aa] font-mono mt-1 px-3 py-1 bg-white/5 rounded-full border border-white/5" data-sd-id="11">4fBz...9xP3</p>
            </section>

            <!-- Amount Input -->
            <section class="bg-bicara-card border border-white/5 rounded-3xl p-6 relative overflow-hidden" data-sd-id="12">
                <!-- Subtle background glow -->
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-bicara-neon/5 rounded-full blur-2xl" data-sd-id="13"></div>
                
                <div class="flex justify-between items-center mb-6" data-sd-id="14">
                    <span class="text-sm text-[#a1a1aa] font-medium" data-sd-id="15">Available Balance</span>
                    <span class="text-sm font-bold text-white" data-sd-id="16">1,250.00 USDC</span>
                </div>
                
                <div class="flex flex-col items-center justify-center my-8" data-sd-id="17">
                    <div class="flex items-baseline justify-center gap-2 w-full" data-sd-id="18">
                        <input type="number" value="50" placeholder="0" class="bg-transparent text-[4rem] font-display font-extrabold text-white text-center w-full max-w-[200px] outline-none caret-bicara-neon" data-sd-id="19">
                    </div>
                    <div class="inline-flex items-center gap-1.5 bg-bicara-bg border border-white/10 rounded-full px-4 py-2 mt-4 cursor-pointer hover:bg-white/5 transition-colors" data-sd-id="20">
                        <div class="w-5 h-5 rounded-full bg-[#2775ca] flex items-center justify-center" data-sd-id="21">
                            <iconify-icon icon="cryptocurrency:usdc" class="text-white text-xs"></iconify-icon>
                        </div>
                        <span class="text-sm font-bold" data-sd-id="22">USDC</span>
                        <iconify-icon icon="lucide:chevron-down" class="text-xs text-[#a1a1aa]"></iconify-icon>
                    </div>
                </div>
                
                <div class="text-center" data-sd-id="23">
                    <p class="text-[#a1a1aa] font-medium text-lg" data-sd-id="24">~$50.00 USD</p>
                </div>
            </section>

            <!-- Quick Percentages -->
            <section class="grid grid-cols-3 gap-3" data-sd-id="25">
                <button class="py-3 rounded-2xl bg-bicara-card border border-white/5 text-sm font-bold text-white hover:bg-white/5 transition-colors" data-sd-id="26">25%</button>
                <button class="py-3 rounded-2xl bg-bicara-card border border-white/5 text-sm font-bold text-white hover:bg-white/5 transition-colors" data-sd-id="27">50%</button>
                <button class="py-3 rounded-2xl bg-bicara-neon/10 border border-bicara-neon/20 text-bicara-neon text-sm font-bold hover:bg-bicara-neon/20 transition-colors" data-sd-id="28">Max</button>
            </section>

            <!-- Voice Input CTA -->
            <section class="flex justify-center pt-2" data-sd-id="29">
                 <button class="flex items-center gap-3 px-6 py-4 rounded-full bg-bicara-card border border-bicara-neon/30 text-white shadow-[0_0_15px_rgba(204,255,0,0.05)] hover:border-bicara-neon/50 transition-colors active:scale-95" data-sd-id="30">
                     <div class="w-8 h-8 rounded-full bg-bicara-neon flex items-center justify-center shadow-[0_0_10px_rgba(204,255,0,0.4)] animate-pulse" data-sd-id="31">
                         <iconify-icon icon="lucide:mic" class="text-bicara-bg text-lg"></iconify-icon>
                     </div>
                     <span class="font-bold text-sm" data-sd-id="32">Hold to speak amount</span>
                 </button>
            </section>

            <!-- Fee Breakdown -->
            <section class="bg-[#141414] rounded-2xl p-4 border border-white/5 space-y-3" data-sd-id="33">
                 <div class="flex justify-between text-sm items-center" data-sd-id="34">
                     <span class="text-[#a1a1aa] flex items-center gap-1" data-sd-id="35">
                         Network Fee
                         <iconify-icon icon="lucide:info" class="text-[10px]"></iconify-icon>
                     </span>
                     <span class="font-medium text-white" data-sd-id="36">~0.000005 SOL (&lt;$0.01)</span>
                 </div>
                 <div class="flex justify-between text-[15px] font-bold pt-3 border-t border-white/5" data-sd-id="37">
                     <span class="text-white" data-sd-id="38">Total</span>
                     <span class="text-bicara-neon" data-sd-id="39">50.00 USDC</span>
                 </div>
            </section>

        </main>

        <!-- Bottom Actions -->
        <footer class="shrink-0 p-6 pb-[34px] bg-bicara-bg border-t border-white/5 flex flex-col gap-3 z-10" data-sd-id="40">
            <a href="https://draft-dd91d8a4-9ad2-49f6-b2a0-eeb7160a35aa.preview.superdesign.dev" id="nav-review-link" class="w-full py-4 rounded-2xl bg-bicara-neon text-bicara-bg font-display font-bold text-[17px] tracking-wide flex items-center justify-center hover:bg-bicara-neon-hover transition-colors shadow-[0_0_20px_rgba(204,255,0,0.2)]" data-sd-id="41">
                Review Transaction
            </a>
            <a href="https://draft-6f40c2c5-a9c0-4ca6-835f-85c5a7ecb96f.preview.superdesign.dev" id="nav-cancel-link" class="w-full py-4 rounded-2xl bg-bicara-card border border-white/5 text-white font-bold text-[17px] flex items-center justify-center hover:bg-white/5 transition-colors" data-sd-id="42">
                Cancel
            </a>
        </footer>

    </div>


</body></html>
